app = "telederma-api"
primary_region = "fra"

[build]
  dockerfile = "../apps/api/Dockerfile"

[env]
  TELEDERMA_ENVIRONMENT = "production"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  method = "GET"
  path = "/api/v1/health"
