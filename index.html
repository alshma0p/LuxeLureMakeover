<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#102A43"><title>مختبر الأفكار الخمس</title><meta name="description" content="مختبر تفاعلي يشرح خمس أفكار ابتكارية قابلة للتنفيذ."><link rel="manifest" href="site.webmanifest"><link rel="icon" href="assets/favicon.svg"><style>html,body{height:100%;margin:0;background:#f8f5ee;color:#14213d;font-family:Tahoma,Arial,sans-serif}body{display:grid;place-items:center}.l{text-align:center}.s{width:46px;height:46px;border:5px solid #d8d2c6;border-top-color:#18a6a6;border-radius:50%;margin:auto;animation:r .8s linear infinite}@keyframes r{to{transform:rotate(360deg)}}</style></head><body><div class="l"><div class="s"></div><p>جارٍ تشغيل مختبر الأفكار...</p></div><script>Promise.all([0,1,2,3].map(i=>fetch('payload/'+i+'.txt').then(r=>{if(!r.ok)throw Error(r.status);return r.text()}))).then(a=>{const d=a.join('').trim(),u=Uint8Array.from(atob(d),c=>c.charCodeAt(0));return new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}).then(h=>{const p='<scr'+'ipt>(function(){document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;var href=a.getAttribute("href");if(a.closest(".idea-nav")&&href&&href.charAt(0)==="#"){e.preventDefault();var t=document.querySelector(href);if(t)t.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})}else if(href==="#ideas"){e.preventDefault();if(location.hash!=="#home")location.hash="home";setTimeout(function(){var x=document.getElementById("ideas");if(x)x.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"start"})},80)}})})();</scr'+'ipt>';document.open();document.write(h.replace('</body>',p+'</body>'));document.close()}).catch(e=>{document.body.innerHTML='<main style="max-width:620px;padding:30px;text-align:center"><h1>تعذر تشغيل الموقع</h1><p>حدّث الصفحة أو افتحها بمتصفح حديث يدعم فك الضغط داخل المتصفح.</p></main>'});</script></body></html>
